name: Fork release

# Builds the phone app and publishes the APKs as a GitHub release of this fork.
# Run it from the Actions tab (Run workflow) with a tag name, or push a tag starting with "dn-".
# Tags are dn-<version>-<N>: <version> must match build.gradle's stmobile versionName and N
# (1-99) counts the fork's releases of it. N goes into the versionCode (-PforkRevision), so every
# release is newer than the last; signed releases also carry newtube.json for the in-app updater.
#
# Signing: with the SIGNING_KEY, KEY_STORE_PASSWORD, ALIAS and KEY_PASSWORD secrets set, every
# release is signed with that one key and installs over the previous one. Without them the APK is
# signed with the runner's throwaway debug key: it installs fine, but the next release can't update
# it in place (Android refuses a different signature), so you'd have to uninstall first.
# upstream's release.yml can't run here: it checks for Aleix's signing certificate.

on:
  push:
    tags: ["dn-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. dn-1.17.1-1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 21.0.6113669   # smarttubetv/build.gradle ndkVersion, as in release.yml
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          fetch-depth: 0   # the update manifest's changelog is the commits since the previous dn-* tag

      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^dn-[0-9]+\.[0-9]+\.[0-9]+-([1-9][0-9]?)$ ]] || { echo "::error::Tag must be dn-<x.y.z>-<1..99>, e.g. dn-1.17.1-3"; exit 1; }
          echo "FORK_REVISION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: Configure signing
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/key.jks"
          {
            echo "storeFile=$RUNNER_TEMP/key.jks"
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: |
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            ./gradlew --no-daemon -PforkRevision="$FORK_REVISION" :smarttubetv:assembleStmobileRelease
          else
            ./gradlew --no-daemon -PforkRevision="$FORK_REVISION" :smarttubetv:assembleStmobileDebug
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$([ "$HAS_SIGNING_KEY" = "true" ] && echo Release || echo Debug)
          mkdir -p dist
          cp smarttubetv/build/outputs/renamed_apks/stmobile$type/ReTube_*.apk dist/
          if [ "$type" = "Release" ]; then
            # The in-app updater reads releases/latest/download/newtube.json. Debug builds get none:
            # they're signed with a throwaway key, so an update could never install over them.
            python3 tools/fork_update_manifest.py --tag "$TAG" --repo "$GITHUB_REPOSITORY" --dist dist --out dist/newtube.json
            cat dist/newtube.json
          fi
          mapfile -t files < <(find dist -type f)
          [ ${#files[@]} -gt 0 ] || { echo "No APKs built"; exit 1; }
          if [ "$type" = "Release" ]; then
            signing="Signed with this fork's release key: installs over earlier releases, and the app offers it as an update."
          else
            signing="Debug build (app id io.github.danielnoam.retube.debug), signed with a throwaway key: uninstall the previous release before installing this one."
          fi
          notes="Built from ${GITHUB_SHA::8}. $signing Pick the arm64-v8a APK for a modern phone, or universal if unsure."
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ReTube $TAG" --notes "$notes"
