name: Build Debug APK

# The phone app (stmobile): unit tests, then a debug APK on every push to main and every PR.
# The old workflow built the TV flavor (stbeta), deleted in the phone-only port.
on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 21.0.6113669   # smarttubetv/build.gradle ndkVersion, as in release.yml
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: Unit tests
        run: ./gradlew --no-daemon :common:testDebugUnitTest :smarttubetv:testStmobileDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - name: Build
        run: ./gradlew --no-daemon :smarttubetv:assembleStmobileDebug

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NewTube-debug-${{ github.run_number }}
          path: ./smarttubetv/build/outputs/apk/stmobile/debug/*.apk
          if-no-files-found: error
